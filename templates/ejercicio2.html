{% extends "base.html" %}

{% block titulo %}Ejercicio 2{% endblock %}

{% block contenido %}
<a class="volver" href="{{ url_for('inicio') }}">&larr; Volver al menú</a>

<section class="tarjeta">
  <h1 class="titulo">Inicio de sesión</h1>

  <form method="post" action="{{ url_for('ejercicio2') }}">
    <div class="campo">
      <label for="usuario">Ingresa tu nombre</label>
      <input type="text" id="usuario" name="usuario" value="{{ usuario }}" required>
    </div>

    <div class="campo">
      <label for="contrasena">Ingresa tu contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required>
    </div>

    <button class="boton" type="submit">Verificar</button>
  </form>

  {% if mensaje %}
    <p class="mensaje exito">{{ mensaje }}</p>
  {% endif %}

  {% if error %}
    <p class="mensaje error">{{ error }}</p>
  {% endif %}
</section>
{% endblock %}
